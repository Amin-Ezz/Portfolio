# ==============================================================================
# Nginx Server Configuration for aminez.ir
# Full-Stack Portfolio Architecture (Amin Esmaeilzadeh)
# Place in: /etc/nginx/sites-available/aminez.ir
# Symlink to: /etc/nginx/sites-enabled/aminez.ir
# ==============================================================================

# 1. HTTP Server — Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name aminez.ir www.aminez.ir;

    # Let's Encrypt ACME Challenge location
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://aminez.ir$request_uri;
    }
}

# 2. HTTPS Server — Production Site & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aminez.ir www.aminez.ir;

    # Redirect www to apex domain
    if ($host = www.aminez.ir) {
        return 301 https://aminez.ir$request_uri;
    }

    # SSL Certificate Configuration (Certbot / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/aminez.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aminez.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression for Ultra-Fast Persian / Global Delivery
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Max Upload Size (Contact attachments or CMS uploads)
    client_max_body_size 25M;

    # Root Directory for Vite-built Frontend Files
    root /var/www/portfolio/front/dist;
    index index.html;

    # Frontend Case Studies & SPA Routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Django Admin & Django REST Framework API -> Gunicorn
    location ~ ^/(api|admin)/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 90;
    }

    # Django Collected Static Files (Admin assets, REST framework CSS/JS)
    location /static/ {
        alias /var/www/portfolio/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Media Files (Uploaded images, videos, resumes)
    location /media/ {
        alias /var/www/portfolio/front/public/media/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Robots & Sitemap
    location = /robots.txt {
        root /var/www/portfolio/front/dist;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        root /var/www/portfolio/front/dist;
        access_log off;
        log_not_found off;
    }
}
