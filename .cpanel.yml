---
deployment:
  tasks:
    - export APPPATH=/home/aminezir/Portfolio
    - export PUBLICPATH=/home/aminezir/public_html
    - /bin/mkdir -p $APPPATH/front/dist
    - /bin/cp -rf front/dist/* $APPPATH/front/dist/
    - /bin/cp -rf front/dist/* $PUBLICPATH/
    - /bin/cp -rf backend/* $APPPATH/backend/
    - /bin/cp -f passenger_wsgi.py $APPPATH/
    - /bin/cp -f passenger_wsgi.py $PUBLICPATH/
    - /bin/mkdir -p $APPPATH/tmp
    - /bin/touch $APPPATH/tmp/restart.txt
